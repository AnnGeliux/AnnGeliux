name: Human or Bot? — Turing game
run-name: "vote by @${{ github.actor }}"
on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: turing-game
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Process vote
        id: turing
        env:
          TURING_ACTION: vote
        run: |
          OUTPUT=$(python game/turing.py)
          echo "$OUTPUT"
          COMMENT=$(printf '%s\n' "$OUTPUT" | sed -n 's/^COMMENT=//p')
          if [ -n "$COMMENT" ]; then
            echo "comment=$COMMENT" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "turing: vote by @${{ github.actor }}"
            git push
          fi

      - name: Reply on issue
        if: steps.turing.outputs.comment != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ steps.turing.outputs.comment }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "$BODY"

      - name: Close vote issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            -c "🎮 Voto registrado. Ve el marcador en mi [perfil](https://github.com/AnnGeliux)."
